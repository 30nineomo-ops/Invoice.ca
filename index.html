<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verified Credential | Invoice.ca</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 20%, #1e293b, #0f172a);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #2563eb;
      --accent-glow: rgba(37, 99, 235, 0.4);
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    /* Main Credential Card */
    .credential-card {
      position: relative;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      padding: 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      color: var(--text-main);
      overflow: hidden;
    }

    /* Top Accent Line */
    .credential-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #3b82f6, #10b981);
    }

    /* Header Section */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.75rem;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: -0.5px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 800;
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--success-bg);
      color: var(--success);
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    /* Credential Info */
    .credential-title {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .credential-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    /* Metadata Grid */
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      background: rgba(15, 23, 42, 0.6);
      padding: 1rem;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 1.5rem;
    }

    .meta-item {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .meta-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
    }

    .meta-value {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-main);
    }

    /* QR Code & Security Stamp */
    .verification-area {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      padding-top: 0.5rem;
      border-top: 1px dashed rgba(255, 255, 255, 0.1);
      margin-bottom: 1.5rem;
    }

    .qr-box {
      width: 68px;
      height: 68px;
      background: #ffffff;
      padding: 6px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .qr-box svg {
      width: 100%;
      height: 100%;
    }

    .verification-text h4 {
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.2rem;
    }

    .verification-text p {
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.35;
    }

    /* Action Button */
    .btn-verify {
      width: 100%;
      padding: 0.75rem;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px var(--accent-glow);
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .btn-verify:hover {
      background: #1d4ed8;
    }

    .btn-verify:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="credential-card">
    <!-- Header: Logo & Verified Pill -->
    <div class="card-header">
      <div class="brand-logo">
        <div class="logo-icon">CA</div>
        <span>Invoice.ca</span>
      </div>
      <div class="badge-status">
        <span class="status-dot"></span>
        Verified Partner
      </div>
    </div>

    <!-- Title & Recipient -->
    <h2 class="credential-title">Enterprise Business Tier</h2>
    <p class="credential-subtitle">Financial Compliance & Verified Merchant</p>

    <!-- Details Grid -->
    <div class="meta-grid">
      <div class="meta-item">
        <span class="meta-label">Credential ID</span>
        <span class="meta-value">INV-8492-X9</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">Jurisdiction</span>
        <span class="meta-value">Canada (CA)</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">Issued Date</span>
        <span class="meta-value">Sep 2026</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">Status</span>
        <span class="meta-value" style="color: var(--success);">Active</span>
      </div>
    </div>

    <!-- Verification / QR Code Section -->
    <div class="verification-area">
      <div class="qr-box">
        <!-- Clean Mock QR Pattern SVG -->
        <svg viewBox="0 0 24 24" fill="#0f172a" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 2h7v7H2V2zm2 2v3h3V4H4zm11-2h7v7h-7V2zm2 2v3h3V4h-3zM2 15h7v7H2v-7zm2 2v3h3v-3H4zm13-1h-2v2h2v-2zm-2 4h-2v2h2v-2zm4 0h-2v2h2v-2zm2-2h-2v-2h2v2zm-2-4h-2v2h2v-2zm-6-2h2v2h-2v-2zm0 4h2v2h-2v-2z"/>
        </svg>
      </div>
      <div class="verification-text">
        <h4>Cryptographically Signed</h4>
        <p>Scan to verify authenticity via the Invoice.ca registry network.</p>
      </div>
    </div>

    <!-- Action -->
    <button class="btn-verify" id="copyBtn">Copy Verification Link</button>
  </div>

  <script>
    const copyBtn = document.getElementById("copyBtn");

    copyBtn.addEventListener("click", () => {
      // Copies the current page URL to clipboard
      navigator.clipboard.writeText(window.location.href).then(() => {
        const originalText = copyBtn.innerText;
        copyBtn.innerText = "Copied to Clipboard!";
        copyBtn.style.background = "var(--success)";
        
        setTimeout(() => {
          copyBtn.innerText = originalText;
          copyBtn.style.background = "var(--accent)";
        }, 2000);
      });
    });
  </script>

</body>
</html>
